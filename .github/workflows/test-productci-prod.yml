name: Test Product CI Prod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  crud-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Dựng API và MongoDB bằng Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Xác nhận trạng thái healthy
        run: |
          set -euo pipefail
          docker compose ps

          for svc in mongodb api; do
            container_id=$(docker compose ps -q "$svc")

            if [ -z "$container_id" ]; then
              echo "FAIL: Không tìm thấy container $svc"
              exit 1
            fi

            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            echo "$svc: $status"

            [ "$status" = "healthy" ] || exit 1
          done

      - name: Chạy test script CRUD
        run: npm test

      - name: In log khi có lỗi
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
