name: Test Product CI Prod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  crud-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Dựng API và MongoDB bằng Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Xác nhận trạng thái healthy
        run: |
          docker compose ps
          for svc in mongodb api; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q $svc)")
            echo "$svc: $status"
            [ "$status" = "healthy" ] || exit 1
          done

      - name: Kiểm tra CRUD qua HTTP
        run: |
          set -euo pipefail
          BASE=http://localhost:3000
          JSON='Content-Type: application/json'

          check() {
            if [ "$2" != "$3" ]; then
              echo "FAIL: $1 (mong đợi $2, nhận $3)"
              exit 1
            fi
            echo "OK: $1"
          }
          http() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          check "health" 200 "$(http $BASE/health)"
          check "create" 201 "$(http -X POST $BASE/api/products -H "$JSON" -d '{"pid":1,"pname":"Laptop","price":1200,"quantity":5}')"
          check "read all" 200 "$(http $BASE/api/products)"
          curl -s $BASE/api/products | jq -e 'length == 1' > /dev/null
          check "update" 200 "$(http -X PUT $BASE/api/products/1 -H "$JSON" -d '{"price":1100,"quantity":8}')"
          curl -s $BASE/api/products/1 | jq -e '.price == 1100 and .quantity == 8' > /dev/null
          echo "OK: dữ liệu sau khi sửa đúng"
          check "trùng pid" 409 "$(http -X POST $BASE/api/products -H "$JSON" -d '{"pid":1,"pname":"Trung","price":10,"quantity":1}')"
          check "giá âm" 400 "$(http -X POST $BASE/api/products -H "$JSON" -d '{"pid":2,"pname":"Am","price":-5,"quantity":1}')"
          check "pid không phải số" 400 "$(http $BASE/api/products/abc)"
          check "delete" 200 "$(http -X DELETE $BASE/api/products/1)"
          check "đã xóa thì 404" 404 "$(http $BASE/api/products/1)"
          echo "TẤT CẢ KIỂM TRA ĐẠT"

      - name: In log khi có lỗi
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v