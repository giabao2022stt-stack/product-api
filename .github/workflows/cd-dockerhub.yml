name: CD Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Dựng Compose và chờ các service healthy
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Xác nhận healthy
        run: |
          docker compose ps
          for svc in mongodb api; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q $svc)")
            echo "$svc: $status"
            [ "$status" = "healthy" ] || exit 1
          done

      - name: Smoke test API
        run: curl -fsS http://localhost:3000/health

      - name: In log khi có lỗi
        if: failure()
        run: docker compose logs --no-color

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v

  push-dockerhub:
    needs: ci-healthcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Đăng nhập Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build và push image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/product-api"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"

      - name: Đăng xuất
        if: always()
        run: docker logout
    deploy-local:
    needs: push-dockerhub
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Kéo image mới từ Docker Hub
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Cập nhật container và chờ healthy
        run: docker compose -f docker-compose-prod.yaml up -d --wait --wait-timeout 120

      - name: Hiển thị trạng thái
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Smoke test API
        run: curl.exe -fsS http://localhost:3000/health